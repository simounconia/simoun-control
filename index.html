<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>SIMOUN · Control Operativo</title>
<meta name="theme-color" content="#0b2c55" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="SIMOUN" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#10233f;--muted:#61738b;--brand:#0b2c55;--accent:#2e8bc0;--line:#dce4ef;--danger:#b42318;--warn:#a15c00;--ok:#18794e;--shadow:0 8px 24px rgba(16,35,63,.08)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.app{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#0b2c55,#164a78);color:#fff;padding:14px 16px;box-shadow:var(--shadow)}.topbar h1{font-size:18px;margin:0}.topbar small{opacity:.8}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.nav button{border:0;border-radius:12px;padding:9px 6px;background:rgba(255,255,255,.12);color:#fff;font-size:12px}.nav button.active{background:#fff;color:var(--brand);font-weight:800}.wrap{max-width:1200px;margin:auto;padding:16px}.page{display:none}.page.active{display:block}.grid{display:grid;gap:14px}.grid.cards{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 10px}.metric{font-size:28px;font-weight:800}.muted{color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.btn{border:0;border-radius:12px;padding:10px 13px;background:var(--brand);color:#fff;font-weight:750;cursor:pointer}.btn.secondary{background:#e8eef6;color:var(--brand)}.btn.light{background:#fff;color:var(--brand);border:1px solid var(--line)}.btn.danger{background:#fff0ee;color:var(--danger);border:1px solid #ffd4ce}.btn.sm{padding:7px 10px;font-size:13px}.search{flex:1;min-width:240px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}.list{display:grid;gap:10px}.client{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.client strong{display:block}.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 8px;font-size:12px;background:#eef3f8;color:#345}.badge.red{background:#fff0ee;color:var(--danger)}.badge.orange{background:#fff6e8;color:var(--warn)}.badge.green{background:#eaf7f1;color:var(--ok)}.badge.blue{background:#e9f4fb;color:#146b96}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field label{font-size:12px;color:var(--muted);font-weight:750}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fff}.field textarea{min-height:88px;resize:vertical}.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 0 10px}.issue{position:relative;overflow:hidden;border-left:5px solid var(--type,#2e8bc0)}.issue.done{opacity:.68}.issue.disabled{opacity:.55;filter:grayscale(.25)}.issue h4{margin:0}.issue-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.issue-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:10px}.kv{background:#f7f9fc;border-radius:10px;padding:8px;font-size:13px}.type-label{display:inline-flex;align-items:center;gap:6px;font-weight:850;border-radius:10px;padding:6px 9px;background:var(--type-bg,#e9f4fb);color:var(--type-ink,#146b96)}.type-panel{margin:12px 0 16px}.type-filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.type-filter{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px;text-align:left;cursor:pointer;box-shadow:0 3px 12px rgba(16,35,63,.04)}.type-filter.active{outline:3px solid color-mix(in srgb,var(--type,#2e8bc0) 28%,transparent);border-color:var(--type,#2e8bc0)}.type-filter strong{display:block}.type-filter small{color:var(--muted)}.review-list{display:grid;gap:10px;margin-top:10px}.review-card{border-left:5px solid var(--type,#2e8bc0)}.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;font-size:11px;color:var(--muted);font-weight:700}.day{min-height:92px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;cursor:pointer}.day.other{opacity:.45}.day.today{outline:2px solid var(--accent)}.day-num{font-size:12px;font-weight:800}.event-dot{display:block;margin-top:4px;padding:3px 5px;border-radius:6px;background:#edf4fb;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:12px}.filter.active{background:var(--brand);color:#fff}.pending-item{display:flex;justify-content:space-between;gap:10px}.pending-item .when{font-size:12px;font-weight:800}.empty{text-align:center;padding:25px;color:var(--muted)}dialog{border:0;border-radius:18px;max-width:780px;width:calc(100% - 24px);max-height:90vh;padding:0;box-shadow:0 25px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(15,35,60,.45)}.modal-head{position:sticky;top:0;background:#fff;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;z-index:3}.modal-body{padding:16px;overflow:auto;max-height:calc(90vh - 64px)}.close{border:0;background:#eef3f8;border-radius:999px;width:34px;height:34px}.notice{background:#edf7ff;border:1px solid #cae9ff;border-radius:12px;padding:10px 12px;font-size:13px}.doc{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;margin-top:6px}.monitor-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:center}.footer-note{font-size:12px;color:var(--muted);margin:16px 0 90px}.fab{position:fixed;right:18px;bottom:20px;z-index:15;border:0;border-radius:999px;width:58px;height:58px;background:var(--accent);color:white;font-size:28px;box-shadow:0 8px 25px rgba(46,139,192,.35)}.split-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.switch-line{display:flex;gap:8px;align-items:center;background:#f7f9fc;border-radius:10px;padding:10px}.history{display:grid;gap:6px}.history-item{font-size:12px;padding:8px;background:#f7f9fc;border-radius:8px}
@media(max-width:720px){.topbar{padding:12px}.nav{gap:5px}.nav button{font-size:10px;padding:8px 2px}.wrap{padding:12px}.row{grid-template-columns:1fr}.client{display:grid}.day{min-height:72px}.event-dot{font-size:0;width:7px;height:7px;border-radius:50%;padding:0}.monitor-row{grid-template-columns:1fr 1fr}.monitor-row .wide{grid-column:1/-1}.btn{min-height:44px}.split-actions{justify-content:flex-start}.type-filters{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <h1>SIMOUN · Control Operativo</h1><small>Expedientes, agenda, pendientes y monitoreos</small>
  <nav class="nav" id="nav"></nav>
</header>
<main class="wrap">
<section id="inicio" class="page active"></section>
<section id="expedientes" class="page"></section>
<section id="calendario" class="page"></section>
<section id="pendientes" class="page"></section>
<section id="monitoreos" class="page"></section>
<div class="footer-note">SIMOUN funciona también sin internet. Si activas la sincronización privada, los expedientes y documentos se comparten entre tus dispositivos autorizados.</div>
</main>
<button class="fab" id="fab" title="Nuevo expediente">+</button>
</div>
<dialog id="clientDlg"><div class="modal-head"><strong id="clientDlgTitle">Expediente</strong><button class="close" onclick="clientDlg.close()">×</button></div><div class="modal-body" id="clientDlgBody"></div></dialog>
<dialog id="issueDlg"><div class="modal-head"><strong id="issueDlgTitle">Asunto</strong><button class="close" onclick="issueDlg.close()">×</button></div><div class="modal-body" id="issueDlgBody"></div></dialog>
<dialog id="dayDlg"><div class="modal-head"><strong id="dayDlgTitle">Agenda del día</strong><button class="close" onclick="dayDlg.close()">×</button></div><div class="modal-body" id="dayDlgBody"></div></dialog>
<dialog id="syncDlg"><div class="modal-head"><strong>Sincronización privada</strong><button class="close" onclick="syncDlg.close()">×</button></div><div class="modal-body" id="syncDlgBody"></div></dialog>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
